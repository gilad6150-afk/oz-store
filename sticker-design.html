<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדבקות שוק באשה ערווה - אופציות להדפסה (105×70 מ"מ • 8 בעמוד)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;800;900&family=Heebo:wght@700;800;900&family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --sticker-w: 105mm;
            --sticker-h: 70mm;
            --page-pad-top: 8.5mm;
            --page-pad-bottom: 8.5mm;
            --purple-color: #6b21a8;
            --purple-dark: #4c1d95;
            --red-color: #dc2626;
            --red-dark: #991b1b;
            --gold-color: #b45309;
            --gold-light: #fef3c7;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: #0f172a;
            color: #0f172a;
            direction: rtl;
            text-align: right;
            -webkit-font-smoothing: antialiased;
        }

        /* -------------------------------------------------------------------------
           TOOLBAR (SCREEN ONLY)
           ------------------------------------------------------------------------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            padding: 12px 18px;
        }

        .toolbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title h1 {
            font-size: 18px;
            font-weight: 900;
            color: #1e1b4b;
        }

        .brand-title span.badge {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
        }

        .actions-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-print {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 9px 18px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }
        .btn-print:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
        }

        .btn-opt {
            background: #fff;
            border-color: #cbd5e1;
            color: #334155;
        }
        .btn-opt.active {
            background: #f3e8ff;
            color: #6b21a8;
            border-color: #c084fc;
            box-shadow: 0 0 0 2px rgba(107, 33, 168, 0.2);
            font-weight: 800;
        }

        .btn-link-anim {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #2563eb;
        }
        .btn-link-anim:hover {
            background: #eff6ff;
        }

        /* -------------------------------------------------------------------------
           PREVIEW WRAPPER
           ------------------------------------------------------------------------- */
        .preview-wrapper {
            padding: 24px 10px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: #0f172a;
        }

        .badge-notice {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            color: #f8fafc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        /* -------------------------------------------------------------------------
           A4 SHEET (2 cols x 4 rows = 8 up, 105mm x 70mm)
           ------------------------------------------------------------------------- */
        .a4-sheet {
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            background: #ffffff;
            margin: 0 auto;
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(2, var(--sticker-w));
            grid-template-rows: repeat(4, var(--sticker-h));
            padding-top: var(--page-pad-top);
            padding-bottom: var(--page-pad-bottom);
            direction: ltr;
            page-break-after: always;
            break-after: page;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* -------------------------------------------------------------------------
           STICKER CARD (105mm x 70mm)
           ------------------------------------------------------------------------- */
        .sticker-card {
            width: var(--sticker-w);
            height: var(--sticker-h);
            box-sizing: border-box;
            padding: 2mm;
            direction: rtl;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            background: #ffffff;
            border: 1px dashed #e2e8f0;
        }

        /* Outer borders for individual sticker card styles */
        .inner-frame-full {
            width: 100%;
            height: 100%;
            border: 2px solid #b45309;
            outline: 1px solid #fde68a;
            outline-offset: -3px;
            border-radius: 6px;
            padding: 2.5mm 2.5mm 1.5mm;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
        }

        /* Ornate Corners */
        .corner {
            position: absolute;
            width: 7px;
            height: 7px;
            border-color: #b45309;
            border-style: solid;
        }
        .c-tl { top: 2px; right: 2px; border-width: 2px 2px 0 0; }
        .c-tr { top: 2px; left: 2px; border-width: 2px 0 0 2px; }
        .c-bl { bottom: 2px; right: 2px; border-width: 0 2px 2px 0; }
        .c-br { bottom: 2px; left: 2px; border-width: 0 0 2px 2px; }

        /* Typography */
        .sticker-title {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 23pt;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: 0.2px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 5px;
            margin-top: 0.5mm;
        }

        .title-shok { color: #6b21a8; font-size: 23pt; font-weight: 900; }
        .title-beisha { color: #1e293b; font-size: 20.5pt; font-weight: 900; }
        .title-erva { color: #dc2626; font-size: 25.5pt; font-weight: 900; }

        .divider-gold {
            width: 78%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #b45309, #fde68a, #b45309, transparent);
            margin: 0.8mm auto 0.4mm;
            position: relative;
        }
        .divider-gold::after {
            content: "❖";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 0 4px;
            color: #b45309;
            font-size: 8px;
        }

        /* -------------------------------------------------------------------------
           OPTION 1 & 3: 4-FIGURES ROW (VECTOR)
           ------------------------------------------------------------------------- */
        .figures-row {
            width: 100%;
            height: 47mm;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: flex-end;
            justify-items: center;
            padding: 0 1mm;
        }

        .fig-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 100%;
        }

        .fig-item svg {
            width: 100%;
            height: 37mm;
        }

        .fig-label {
            font-size: 8.5pt;
            font-weight: 800;
            line-height: 1.1;
            margin-top: 1mm;
            white-space: nowrap;
        }

        .lbl-valid { color: #059669; }
        .lbl-invalid { color: #dc2626; }

        /* -------------------------------------------------------------------------
           OPTION 2: 2-FIGURES CONTRAST (כשר מול אסור)
           ------------------------------------------------------------------------- */
        .contrast-row {
            width: 100%;
            height: 48mm;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            justify-items: center;
            padding: 0 3mm;
            gap: 4mm;
        }

        .contrast-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            padding: 1.5mm 1mm;
        }

        .contrast-valid {
            border: 1.5px solid #10b981;
            background: #f0fdf4;
        }

        .contrast-invalid {
            border: 1.5px solid #ef4444;
            background: #fef2f2;
        }

        .contrast-box svg {
            width: 100%;
            height: 35mm;
        }

        .contrast-header {
            font-size: 9.5pt;
            font-weight: 900;
            border-radius: 4px;
            padding: 1px 6px;
        }
        .ch-valid { background: #dcfce7; color: #15803d; }
        .ch-invalid { background: #fee2e2; color: #b91c1c; }

        .contrast-footer {
            font-size: 8.5pt;
            font-weight: 800;
            margin-top: 1mm;
        }

        /* -------------------------------------------------------------------------
           PRINT STYLES (@media print)
           ------------------------------------------------------------------------- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            html, body {
                width: 210mm;
                height: 297mm;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
            }
            .toolbar, .badge-notice, .no-print {
                display: none !important;
            }
            .preview-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                background: #ffffff !important;
            }
            .a4-sheet {
                box-shadow: none !important;
                margin: 0 !important;
                page-break-after: avoid;
                break-after: avoid;
            }
            .sticker-card {
                border: 0.2px solid transparent !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <!-- SCREEN TOOLBAR -->
    <header class="toolbar no-print">
        <div class="toolbar-inner">
            <div class="brand-title">
                <h1>מדבקות "שוק באשה ערווה"</h1>
                <span class="badge">A4 • 8 מדבקות (105×70 מ"מ)</span>
            </div>

            <div class="actions-bar">
                <span style="font-size:12px; font-weight:800; color:#475569;">בחר אופציית הדפסה:</span>
                
                <button type="button" class="btn btn-opt active" onclick="switchDesign('opt1')" id="btn-opt1">
                    1. מדריך מלא (4 מצבים)
                </button>
                <button type="button" class="btn btn-opt" onclick="switchDesign('opt2')" id="btn-opt2">
                    2. ניגודיות ענק (כשר מול אסור)
                </button>
                <button type="button" class="btn btn-opt" onclick="switchDesign('opt3')" id="btn-opt3">
                    3. מסגרת זהב יוקרתית
                </button>
                <button type="button" class="btn btn-opt" onclick="switchDesign('opt4')" id="btn-opt4">
                    4. דף מיקס משולב (4+4)
                </button>

                <span style="border-left:1px solid #cbd5e1; height:22px; margin:0 3px;"></span>

                <button type="button" class="btn btn-print" onclick="window.print()">
                    <span>🖨️ הדפס מדבקות (Ctrl+P)</span>
                </button>

                <a href="shok-erva.html" class="btn btn-link-anim">
                    <span>✨ לסימולטור המונפש</span>
                </a>
            </div>
        </div>
    </header>

    <!-- PREVIEW AREA -->
    <main class="preview-wrapper">
        <div class="badge-notice no-print">
            <span>✨</span>
            <span id="opt-desc">אופציה 1: מדריך מלא – כל 4 מצבי האורך בציור וקטורי חד עם נעליים וקווים מקווקווים</span>
        </div>

        <div class="a4-sheet" id="stickers-sheet">
            <!-- 8 stickers injected via JS -->
        </div>
    </main>

    <script>
        // Vector SVGs definitions
        const SVG_DEFS = `
            <defs>
                <linearGradient id="stkSkirtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#18181b" />
                    <stop offset="20%" stop-color="#3f3f46" />
                    <stop offset="40%" stop-color="#18181b" />
                    <stop offset="60%" stop-color="#52525b" />
                    <stop offset="80%" stop-color="#18181b" />
                    <stop offset="100%" stop-color="#27272a" />
                </linearGradient>
            </defs>
        `;

        // Generate Figure SVG: 
        // type: 1 (full / covered), 2 (past knee), 3 (at knee), 4 (above knee)
        function getFigureSvg(type, scale = 1) {
            let skirtY = 110;
            let skirtW = 24;
            let badge = '✔';
            let badgeColor = '#10b981';
            let label = 'כל השוק מכוסה';
            let isCovered = true;

            if (type === 1) {
                skirtY = 112; skirtW = 24; badge = '✔'; badgeColor = '#10b981'; label = 'כל השוק מכוסה'; isCovered = true;
            } else if (type === 2) {
                skirtY = 86; skirtW = 19; badge = '✖'; badgeColor = '#ef4444'; label = 'רוב השוק מכוסה'; isCovered = false;
            } else if (type === 3) {
                skirtY = 66; skirtW = 16; badge = '✖'; badgeColor = '#ef4444'; label = 'רוב השוק מגולה'; isCovered = false;
            } else if (type === 4) {
                skirtY = 46; skirtW = 14; badge = '✖'; badgeColor = '#ef4444'; label = 'שוק מגולה'; isCovered = false;
            }

            const dashedLines = isCovered ? '' : `
                <line x1="33" y1="${skirtY}" x2="33" y2="112" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2.5,2" />
                <line x1="47" y1="${skirtY}" x2="47" y2="112" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2.5,2" />
            `;

            const iconBadge = isCovered ? `
                <g transform="translate(40, 68)">
                    <circle cx="0" cy="0" r="10" fill="#10b981" />
                    <path d="M -4 0 L -1 3 L 5 -2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </g>
            ` : `
                <g transform="translate(40, ${skirtY + 12})">
                    <circle cx="0" cy="0" r="8.5" fill="#ef4444" />
                    <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
                    <line x1="3.5" y1="-3.5" x2="-3.5" y2="3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
                </g>
            `;

            return `
                <svg viewBox="0 0 80 130" xmlns="http://www.w3.org/2000/svg">
                    ${SVG_DEFS}
                    ${dashedLines}
                    <!-- Shoe -->
                    <g transform="translate(26, 112)">
                        <path d="M 0 5 C 1 1, 8 0, 12 2 C 16 4, 20 6, 26 6 C 29 6, 31 8, 30 11 C 28 12, 24 12, 11 12 C 8 12, 0 11, 0 8 Z" fill="#18181b" stroke="#52525b" stroke-width="0.8" />
                        <rect x="1" y="9" width="5" height="3" rx="0.5" fill="#09090b" />
                    </g>
                    <!-- Pleated Skirt -->
                    <g>
                        <path d="M 28 18 Q 40 17 52 18 L ${40 + skirtW} ${skirtY} Q 40 ${skirtY + 3} ${40 - skirtW} ${skirtY} Z" fill="url(#stkSkirtGrad)" stroke="#52525b" stroke-width="0.8" />
                        <!-- Folds -->
                        <line x1="33" y1="18" x2="${40 - skirtW + 4}" y2="${skirtY}" stroke="#18181b" stroke-width="1" opacity="0.8" />
                        <line x1="38" y1="17" x2="36" y2="${skirtY + 1}" stroke="#18181b" stroke-width="1" opacity="0.8" />
                        <line x1="42" y1="17" x2="44" y2="${skirtY + 1}" stroke="#18181b" stroke-width="1" opacity="0.8" />
                        <line x1="47" y1="18" x2="${40 + skirtW - 4}" y2="${skirtY}" stroke="#18181b" stroke-width="1" opacity="0.8" />
                    </g>
                    <!-- Waist -->
                    <rect x="27" y="16" width="26" height="3" rx="1" fill="#d97706" />
                    ${iconBadge}
                </svg>
            `;
        }

        // Templates for sticker options
        function renderStickerOpt1() {
            return `
                <div class="sticker-card">
                    <div class="inner-frame-full">
                        <span class="corner c-tl"></span><span class="corner c-tr"></span>
                        <span class="corner c-bl"></span><span class="corner c-br"></span>

                        <div class="sticker-title">
                            <span class="title-shok">שׁוֹק</span>
                            <span class="title-beisha">בְּאִשָּׁה</span>
                            <span class="title-erva">עֶרְוָה!</span>
                        </div>
                        <div class="divider-gold"></div>

                        <div class="figures-row">
                            <!-- 1. שוק מגולה -->
                            <div class="fig-item">
                                ${getFigureSvg(4)}
                                <div class="fig-label lbl-invalid">שוק מגולה ✖</div>
                            </div>
                            <!-- 2. רוב השוק מגולה -->
                            <div class="fig-item">
                                ${getFigureSvg(3)}
                                <div class="fig-label lbl-invalid">רוב מגולה ✖</div>
                            </div>
                            <!-- 3. רוב השוק מכוסה -->
                            <div class="fig-item">
                                ${getFigureSvg(2)}
                                <div class="fig-label lbl-invalid">רוב מכוסה ✖</div>
                            </div>
                            <!-- 4. כל השוק מכוסה -->
                            <div class="fig-item">
                                ${getFigureSvg(1)}
                                <div class="fig-label lbl-valid">כל השוק מכוסה ✔</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStickerOpt2() {
            return `
                <div class="sticker-card">
                    <div class="inner-frame-full" style="border-color:#7e22ce; outline-color:#e9d5ff;">
                        <span class="corner c-tl" style="border-color:#7e22ce;"></span>
                        <span class="corner c-tr" style="border-color:#7e22ce;"></span>
                        <span class="corner c-bl" style="border-color:#7e22ce;"></span>
                        <span class="corner c-br" style="border-color:#7e22ce;"></span>

                        <div class="sticker-title" style="font-size:24pt; margin-top:0;">
                            <span class="title-shok" style="font-size:24pt;">שׁוֹק</span>
                            <span class="title-beisha" style="font-size:21.5pt;">בְּאִשָּׁה</span>
                            <span class="title-erva" style="font-size:26.5pt;">עֶרְוָה!</span>
                        </div>
                        <div class="divider-gold"></div>

                        <div class="contrast-row">
                            <!-- כשר (מימין) -->
                            <div class="contrast-box contrast-valid">
                                <div class="contrast-header ch-valid">כשר ✔</div>
                                ${getFigureSvg(1)}
                                <div class="contrast-footer lbl-valid">כל השוק מכוסה</div>
                            </div>

                            <!-- אסור (משמאל) -->
                            <div class="contrast-box contrast-invalid">
                                <div class="contrast-header ch-invalid">אסור ✖</div>
                                ${getFigureSvg(3)}
                                <div class="contrast-footer lbl-invalid">שוק מגולה</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStickerOpt3() {
            return `
                <div class="sticker-card" style="background:#fffdfa;">
                    <div class="inner-frame-full" style="border-width:2.5px; border-color:#b45309; outline-offset:-4px; outline:1.5px solid #d97706; box-shadow: inset 0 0 0 5px #fffdfa, inset 0 0 0 7px #b45309;">
                        <span class="corner c-tl" style="top:5px; right:5px; border-width:3px 3px 0 0;"></span>
                        <span class="corner c-tr" style="top:5px; left:5px; border-width:3px 0 0 3px;"></span>
                        <span class="corner c-bl" style="bottom:5px; right:5px; border-width:0 3px 3px 0;"></span>
                        <span class="corner c-br" style="bottom:5px; left:5px; border-width:0 0 3px 3px;"></span>

                        <div class="sticker-title" style="font-size:23pt; margin-top:0.5mm;">
                            <span style="color:#78350f; font-size:23pt;">שׁוֹק</span>
                            <span style="color:#1e293b; font-size:20.5pt;">בְּאִשָּׁה</span>
                            <span style="color:#b91c1c; font-size:25.5pt;">עֶרְוָה!</span>
                        </div>
                        <div class="divider-gold"></div>

                        <div class="figures-row" style="height:46mm;">
                            <div class="fig-item">
                                ${getFigureSvg(4)}
                                <div class="fig-label lbl-invalid">שוק מגולה ✖</div>
                            </div>
                            <div class="fig-item">
                                ${getFigureSvg(3)}
                                <div class="fig-label lbl-invalid">רוב מגולה ✖</div>
                            </div>
                            <div class="fig-item">
                                ${getFigureSvg(2)}
                                <div class="fig-label lbl-invalid">רוב מכוסה ✖</div>
                            </div>
                            <div class="fig-item">
                                ${getFigureSvg(1)}
                                <div class="fig-label lbl-valid" style="font-weight:900;">כל השוק מכוסה ✔</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        const descriptions = {
            opt1: 'אופציה 1: מדריך מלא – 4 מצבי אורך בציור וקטורי חד עם נעליים וקווים מקווקווים (8 מדבקות זהות)',
            opt2: 'אופציה 2: ניגודיות ענק – כשר וצנוע (חצאית מלאה ✔) מול אסור (שוק מגולה ✖) באותיות גדולות ובולטות',
            opt3: 'אופציה 3: מהדורת זהב יוקרתית – מסגרת כפולה מלכותית מעוטרת בעיצוב יודאיקה אותנטי',
            opt4: 'אופציה 4: דף מיקס משולב – 4 מדבקות מדריך מלא + 4 מדבקות ניגודיות ענק באותו עמוד A4!'
        };

        function renderSheet(opt) {
            const sheet = document.getElementById('stickers-sheet');
            sheet.innerHTML = '';

            if (opt === 'opt1') {
                for (let i = 0; i < 8; i++) sheet.innerHTML += renderStickerOpt1();
            } else if (opt === 'opt2') {
                for (let i = 0; i < 8; i++) sheet.innerHTML += renderStickerOpt2();
            } else if (opt === 'opt3') {
                for (let i = 0; i < 8; i++) sheet.innerHTML += renderStickerOpt3();
            } else if (opt === 'opt4') {
                // Mix: 4 of Opt 1 and 4 of Opt 2
                for (let i = 0; i < 4; i++) sheet.innerHTML += renderStickerOpt1();
                for (let i = 0; i < 4; i++) sheet.innerHTML += renderStickerOpt2();
            }

            document.getElementById('opt-desc').textContent = descriptions[opt];
        }

        function switchDesign(opt) {
            document.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + opt).classList.add('active');
            renderSheet(opt);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderSheet('opt1');
        });
    </script>
</body>
</html>
