    <!-- FLOATING STICKY MOBILE & DESKTOP CART BUTTON (BOTTOM LEFT) -->
    <div id="floating-cart-btn-wrapper" class="fixed bottom-6 left-6 z-[999999]">
        <button onclick="toggleCartDrawer()" class="group relative flex items-center gap-2.5 px-4 py-3.5 sm:px-5 sm:py-3.5 bg-gradient-to-r from-[#29114D] via-oz-primary to-[#190933] hover:from-purple-800 hover:to-indigo-900 text-white rounded-full sm:rounded-2xl shadow-2xl shadow-purple-950/60 border border-purple-400/40 backdrop-blur-md transition-all duration-300 hover:scale-105 active:scale-95 cursor-pointer" title="סל הקניות">
            
            <!-- Animated Pulse Ring when cart has items -->
            <span id="floating-cart-pulse" class="absolute -top-1 -right-1 w-4 h-4 bg-purple-600 rounded-full animate-ping opacity-75 hidden"></span>
            
            <!-- Cart Icon & Badge -->
            <div class="relative flex items-center justify-center">
                <svg class="w-6 h-6 text-purple-300 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119.993z"/>
                </svg>
                <span id="floating-cart-badge" class="absolute -top-2.5 -right-2.5 bg-purple-600 text-slate-950 font-black text-[11px] min-w-[20px] h-[20px] px-1 rounded-full flex items-center justify-center border-2 border-purple-950 shadow-md">0</span>
            </div>

            <!-- Button Label (Visible on Mobile & Desktop) -->
            <div class="flex flex-col text-right pr-0.5">
                <span class="text-xs font-black text-purple-200 leading-none">סל הקניות</span>
                <span id="floating-cart-total" class="text-[10px] text-purple-200 font-bold leading-tight mt-0.5">0 פריטים</span>
            </div>
        </button>
    </div>

    <!-- SIDE CART DRAWER (SLIDES IN FROM THE RIGHT) -->
    <div id="cart-drawer-backdrop" onclick="toggleCartDrawer()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999998] hidden transition-opacity"></div>

    <aside id="cart-drawer" class="fixed inset-y-0 right-0 z-[9999999] w-full max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between text-right dir-rtl">
        
        <!-- Drawer Header -->
        <div class="p-5 border-b border-purple-100 flex items-center justify-between bg-slate-50/80">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-2xl bg-purple-100 text-oz-primary flex items-center justify-center font-black text-xl shadow-inner">🛒</div>
                <div>
                    <h3 class="font-black text-lg text-slate-900">סל הקניות שלך</h3>
                    <p id="cart-drawer-count" class="text-xs text-slate-500 font-bold">0 פריטים בסל</p>
                </div>
            </div>
            <button onclick="toggleCartDrawer()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold text-xl flex items-center justify-center transition-colors">&times;</button>
        </div>

        <!-- Free Shipping Progress Bar -->
        <div class="p-4 bg-gradient-to-r from-purple-50 to-indigo-50 border-b border-purple-100 px-5">
            <div class="flex justify-between text-xs font-bold text-slate-700 mb-1.5" id="drawer-shipping-text">
                <span>משלוח חינם מעל ₪399:</span>
                <span id="drawer-shipping-diff" class="text-oz-primary font-black">נותרו עוד ₪399</span>
            </div>
            <div class="w-full h-2 bg-purple-200/70 rounded-full overflow-hidden">
                <div id="drawer-shipping-progress" class="h-full bg-gradient-to-r from-purple-600 to-amber-400 transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Cart Items Container -->
        <div id="cart-drawer-items" class="flex-grow p-5 overflow-y-auto space-y-3.5">
            <!-- Dynamically populated via JS -->
        </div>

        <!-- Upsell Recommendation Offer -->
        <div class="p-4 mx-5 mb-3 bg-gradient-to-r from-purple-50 via-amber-50/70 to-purple-50 rounded-2xl border border-amber-300/80 shadow-md flex items-center justify-between gap-3 text-right dir-rtl">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-purple-600/20 text-amber-800 flex items-center justify-center font-black text-2xl shrink-0 shadow-inner">
                    🎁
                </div>
                <div>
                    <div class="font-extrabold text-xs text-slate-900 leading-snug">תיק תפילין דק קטן LB2054</div>
                    <div class="text-[11px] font-black text-oz-primary mt-0.5">₪140 <span class="text-[9px] text-emerald-700 font-bold bg-emerald-100 px-1.5 py-0.5 rounded-md">מומלץ להגנה</span></div>
                </div>
            </div>
            <button onclick="addToCart('7718')" class="py-2.5 px-4 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-950 font-black text-xs rounded-xl shadow-md transition-all duration-200 hover:scale-105 active:scale-95 shrink-0 flex items-center gap-1 cursor-pointer">
                <span>+ הוסף לסל</span>
            </button>
        </div>

        <!-- Drawer Footer / Summary & Checkout -->
        <div class="p-5 border-t border-purple-100 bg-slate-50/90 space-y-3">
            <div class="space-y-1.5 text-xs font-bold text-slate-600">
                <div class="flex justify-between">
                    <span>סכום ביניים:</span>
                    <span id="cart-drawer-subtotal" class="font-black text-slate-900">₪0</span>
                </div>
                <div class="flex justify-between">
                    <span>דמי משלוח:</span>
                    <span id="cart-drawer-shipping-cost" class="font-black text-slate-900">₪35</span>
                </div>
                <div class="flex justify-between text-base font-black text-oz-primary pt-2 border-t border-purple-200">
                    <span>סה"כ לתשלום:</span>
                    <span id="cart-drawer-total" class="text-xl">₪0</span>
                </div>
            </div>

            <button onclick="openCheckoutFromDrawer()" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white font-black text-sm rounded-2xl shadow-xl shadow-emerald-600/20 transition-all active:scale-95 flex items-center justify-center gap-2">
                <span>מעבר לקופה מאובטחת 🔒</span>
            </button>

            <button onclick="toggleCartDrawer()" class="w-full py-2.5 bg-slate-200/80 hover:bg-slate-300 text-slate-700 font-bold text-xs rounded-xl transition-colors">
                המשך בקניות 🛍️
            </button>
        </div>
    </aside>
